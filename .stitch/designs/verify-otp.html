<script>
        document.addEventListener('DOMContentLoaded', () => {
            // OTP Input Logic
            const inputs = document.querySelectorAll('.otp-input');
            
            inputs.forEach((input, index) => {
                // Focus first input automatically
                if(index === 0) setTimeout(() => input.focus(), 500);

                input.addEventListener('input', (e) => {
                    const val = e.target.value;
                    // Ensure only numbers
                    e.target.value = val.replace(/[^0-9]/g, '').substring(0,1);
                    
                    if (e.target.value !== '') {
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        } else {
                            // Last input filled, maybe auto-submit or visual cue
                            input.blur();
                            document.querySelector('button[type="submit"]').classList.add('animate-pulse-slow');
                        }
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '') {
                        if (index > 0) {
                            inputs[index - 1].focus();
                        }
                    }
                });
                
                // Handle paste
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
                    if(pastedData) {
                        for(let i=0; i < pastedData.length; i++) {
                            if(inputs[i]) {
                                inputs[i].value = pastedData[i];
                                if(i === pastedData.length - 1 && i < inputs.length - 1) {
                                    inputs[i+1].focus();
                                }
                            }
                        }
                    }
                });
            });

            // Timer Logic
            let timeLeft = 59;
            const timerSpan = document.getElementById('timer');
            const resendBtn = document.getElementById('resendBtn');
            
            const timerId = setInterval(() => {
                timeLeft--;
                const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                timerSpan.textContent = `00:${seconds}`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    resendBtn.disabled = false;
                    resendBtn.innerHTML = 'Resend Code';
                    resendBtn.classList.remove('text-sunlit-clementine');
                    resendBtn.classList.add('text-primary', 'font-medium');
                }
            }, 1000);
            
            // Form Submit Simulation
            document.getElementById('otpForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = e.submitter;
                const originalText = btn.innerHTML;
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Verifying...';
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    // Add shake error animation just for demonstration of interactivity
                    document.getElementById('otp-container').classList.add('animate-[shake_0.5s_ease-in-out]');
                    inputs.forEach(i => {
                       i.classList.add('border-terracotta-rose', 'text-terracotta-rose');
                       i.classList.remove('border-whisper-border', 'focus:border-sunlit-clementine');
                    });
                    setTimeout(() => document.getElementById('otp-container').classList.remove('animate-[shake_0.5s_ease-in-out]'), 500);
                }, 1500);
            });
        });
    </script>

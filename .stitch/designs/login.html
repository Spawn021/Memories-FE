<style>
        @keyframes waterfall {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .reveal-item {
            opacity: 0;
            animation: waterfall 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .spring-btn {
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease;
        }
        
        .spring-btn:hover {
            transform: scale(1.02);
        }

        .spring-btn:active {
            transform: scale(0.98);
        }

        /* Material Symbols weight */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        .input-focus-ring:focus {
            border-color: #E26A4A !important;
            box-shadow: 0 0 0 3px rgba(226, 106, 74, 0.18) !important;
        }
        
        /* Warm tint overlay for collage */

            content: '';
            position: absolute;
            inset: 0;
            background: #E26A4A;
            mix-blend-mode: soft-light;

    </style>

<script>
    // Atmospheric parallax on mouse move
    document.addEventListener('mousemove', (e) => {
        const artPanel = document.querySelector('section:last-child');
        if (!artPanel || window.innerWidth < 768) return;
        
        const x = (window.innerWidth - e.pageX * 2) / 150;
        const y = (window.innerHeight - e.pageY * 2) / 150;
        
        const elements = artPanel.querySelectorAll('.reveal-item');
        elements.forEach((el, i) => {
            const depth = (i + 1) * 1.5;
            // Only apply transform if it doesn't break the initial animation state
            if (el.style.opacity === '1') {
                el.style.transform = `translateX(${x * depth}px) translateY(${y * depth}px)`;
            }
        });
    });

    // Label focus states
    const inputs = document.querySelectorAll('input[type="email"], input[type="password"]');
    inputs.forEach(input => {
        input.addEventListener('focus', () => {
            const label = input.closest('div').querySelector('label');
            if(label) label.classList.add('text-sunlit-clementine');
        });
        input.addEventListener('blur', () => {
            const label = input.closest('div').querySelector('label');
            if(label) label.classList.remove('text-sunlit-clementine');
        });
    });
</script>

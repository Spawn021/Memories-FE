<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes waterfall {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .animate-waterfall {
            animation: waterfall 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
        }

        .spring-hover:hover {
            transform: scale(1.02);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .spring-active:active {
            transform: scale(0.98);
            transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .whisper-border-box {
            border: 1px solid rgba(24, 26, 26, 0.05);
        }

        .sienna-overlay::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(161, 58, 30, 0.08); /* Tonal shift to warm primary */
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        .polaroid {
            padding: 12px 12px 48px 12px;
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            transform: rotate(var(--rotation, 0deg));

<body class="bg-canvas-linen font-body-md text-on-surface overflow-x-hidden">
<!-- Main Auth Shell -->
<main class="min-h-screen flex">
<!-- Left Panel: Form Container (Transactional / Focused) -->
<section class="w-full md:w-1/2 bg-pure-surface flex flex-col justify-center px-margin-mobile md:px-margin-desktop py-12 relative">
<!-- Branding Header -->
<div class="absolute top-12 left-margin-mobile md:left-margin-desktop">
<svg class="h-8 w-auto" viewBox="0 0 160 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo Mark -->
  <g transform="translate(0, 2)">
    <rect x="2" y="2" width="32" height="32" rx="4" fill="#FFFFFF" stroke="#181A1A" stroke-width="2"/>
    <line x1="2" y1="26" x2="34" y2="26" stroke="#181A1A" stroke-width="1.5"/>
    <circle cx="18" cy="14" r="5" fill="#E26A4A"/>
    <path d="M6 26L13 16L18 21L24 13L30 26H6Z" fill="#181A1A" opacity="0.95"/>
    <path d="M12 26L18 18L23 23L27 18L30 26H12Z" fill="#5C6E60" opacity="0.8"/>
  </g>
  <!-- Wordmark -->

</svg>
</div>
<div class="max-w-form-max-width w-full mx-auto mt-12 md:mt-0">
<header class="mb-10 animate-waterfall" style="animation-delay: 50ms;">
<h1 class="font-headline-lg text-headline-lg mb-3">Create your space</h1>
<p class="font-body-lg text-body-lg text-muted-leaf">Start preserving your intimate moments with friends and family.</p>
</header>
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div class="animate-waterfall" style="animation-delay: 150ms;">
<label class="block font-label-sm text-label-sm text-muted-leaf mb-2" for="email">EMAIL ADDRESS</label>
<input class="w-full px-4 py-3 bg-pure-surface whisper-border-box rounded-md focus:ring-2 focus:ring-sunlit-clementine/20 focus:border-sunlit-clementine outline-none transition-all placeholder:text-surface-dim" id="email" name="email" placeholder="e.g. hoang.nam@domain.com" type="email"/>
</div>
<!-- Password Field -->
<div class="animate-waterfall" style="animation-delay: 200ms;">
<label class="block font-label-sm text-label-sm text-muted-leaf mb-2" for="password">PASSWORD</label>
<input class="w-full px-4 py-3 bg-pure-surface whisper-border-box rounded-md focus:ring-2 focus:ring-sunlit-clementine/20 focus:border-sunlit-clementine outline-none transition-all placeholder:text-surface-dim" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<!-- Confirm Password Field -->
<div class="animate-waterfall" style="animation-delay: 250ms;">
<label class="block font-label-sm text-label-sm text-muted-leaf mb-2" for="confirm-password">CONFIRM PASSWORD</label>
<input class="w-full px-4 py-3 bg-pure-surface whisper-border-box rounded-md focus:ring-2 focus:ring-sunlit-clementine/20 focus:border-sunlit-clementine outline-none transition-all placeholder:text-surface-dim" id="confirm-password" name="confirm-password" placeholder="••••••••" type="password"/>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start animate-waterfall" style="animation-delay: 300ms;">
<div class="flex items-center h-5">
<input class="h-4 w-4 text-sunlit-clementine border-outline-variant rounded focus:ring-sunlit-clementine" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-body-md text-muted-leaf" for="terms">
                                I agree to the <a class="text-primary hover:underline" href="#">Terms of Service</a> &amp; <a class="text-primary hover:underline" href="#">Privacy Policy</a>
</label>
</div>
</div>
<!-- CTA Actions -->
<div class="space-y-4 pt-4 animate-waterfall" style="animation-delay: 350ms;">
<button class="w-full py-4 bg-sunlit-clementine text-on-primary font-headline-md text-body-md rounded-md spring-hover spring-active shadow-lg shadow-sunlit-clementine/10" type="submit">
                            Create Space
                        </button>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-whisper-border"></div>
<span class="flex-shrink mx-4 text-surface-dim font-label-sm">OR</span>
<div class="flex-grow border-t border-whisper-border"></div>
</div>
<button class="w-full py-4 bg-pure-surface whisper-border-box text-on-surface font-body-md rounded-md flex items-center justify-center gap-3 spring-hover spring-active" type="button">
<svg class="h-5 w-5" viewbox="0 0 24 24">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                            Continue with Google

</div>
</form>
<footer class="mt-12 text-center animate-waterfall" style="animation-delay: 450ms;">
<p class="font-body-md text-muted-leaf">

</div>
<!-- Polaroid 4 -->
<div class="polaroid sienna-overlay animate-waterfall self-end" style="--rotation: 5deg; animation-delay: 900ms;">
<img alt="Memory fragment 4" class="w-full aspect-[3/4] object-cover" data-alt="A delicate hand holding a single dried wildflower against a neutral, sun-bleached wall. The lighting is soft and flat, creating a gentle contrast that emphasizes the intricate details of the flower's petals. The overall mood is one of quiet appreciation and preserved beauty in a modern aesthetic." src="https://lh3.googleusercontent.com/aida/AP1WRLtvhmSjGO7HarOzVMW7avX9w0V_OTccgdnPkv-Tn4F_Zk4bl2_dLbU6Vc7F5vVmH9jflUBTUO9BlMkgUm_TlgUHdiIJieZ-ZIfdbqWckW_MoTBlFE3e7ahedP2zj7BvQMlUw5hmBovuGisdzQugT1yDgUY8GzTt2aZpCqyxnWkYhxOl68NEjUpUjf68XAUNlpKZI0TETYT_tbIPQN2OGPxLQFs4MScla86IDMvZERGMopIk1V_LXLl3xiWX"/>
</div>
</div>
<!-- Quote Container -->
<div class="mt-16 text-center max-w-sm z-10 animate-waterfall" style="animation-delay: 1100ms;">
<p class="font-poetic-accent text-poetic-accent italic text-on-surface-variant mb-4">
                    “We write to taste life twice, in the moment and in retrospect.”
                </p>
<cite class="font-label-sm text-label-sm tracking-widest text-muted-leaf uppercase not-italic">
                    — Anaïs Nin
                </cite>
</div>
<!-- Atmospheric Pulse Background Detail -->
<div class="absolute top-1/4 right-0 w-96 h-96 bg-sunlit-clementine/5 rounded-full blur-[100px] -mr-48"></div>
<div class="absolute bottom-1/4 left-0 w-96 h-96 bg-muted-leaf/5 rounded-full blur-[100px] -ml-48"></div>
</section>
</main>
<script>
        // Micro-interaction: Subtle parallax on the collage elements
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.005;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.005;
            
            const polaroids = document.querySelectorAll('.polaroid');
            polaroids.forEach((polaroid, index) => {
                const depth = (index + 1) * 0.5;
                polaroid.style.transform = `rotate(var(--rotation, 0deg)) translate(${moveX * depth}px, ${moveY * depth}px)`;
            });
        });

        // Form submission micro-pulse
        const form = document.querySelector('form');
        form.addEventListener('submit', (e) => {
            // Placeholder for success animation
            console.log('Generating your space...');
        });
    </script>
